<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>OneClient UI preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>
<script>
  // stand-in for the game: sky, hills, blocks and some pixel text, so the blur has detail to chew on
  var c = document.getElementById('scene'), g = c.getContext('2d');
  function draw() {
    c.width = innerWidth; c.height = innerHeight;
    var w = c.width, h = c.height;
    var sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#6ea8ff'); sky.addColorStop(.6, '#cfe6ff'); sky.addColorStop(1, '#8fd16a');
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 90; i++) {
      g.fillStyle = ['#4c9b2f', '#3b7d24', '#7a5a35', '#9aa0a6', '#e8d9a8'][i % 5];
      var s = 24 + (i * 37) % 44; g.fillRect((i * 173) % w, h * .45 + (i * 59) % (h * .5), s, s);
    }
    g.fillStyle = '#fff'; g.font = 'bold 22px monospace';
    for (var j = 0; j < 14; j++) g.fillText('Minecraft  ' + (j * 123457 % 9999), 40 + (j * 211) % (w - 200), 80 + (j * 97) % (h - 160));
    g.fillStyle = '#222'; g.fillRect(w / 2 - 182, h - 40, 364, 40);
  }
  draw(); addEventListener('resize', draw);
</script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="mods.js"></script>
</body>
</html>
